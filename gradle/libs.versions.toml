[versions]
kotlin = "2.4.10"
spring-boot = "3.5.16"
spring-dependency-management = "1.1.7"
# koog-agents-jvm is released without the "-beta" suffix that the (still-beta)
# Spring AI starter modules carry, even within the same overall Koog release.
koog = "1.1.1"
koog-spring-ai = "1.1.1-beta"
spring-ai = "1.1.6"
kotlinx-serialization = "1.11.0"

[libraries]
koog-agents = { module = "ai.koog:koog-agents-jvm", version.ref = "koog" }
koog-spring-ai-starter-model-chat = { module = "ai.koog:koog-spring-ai-starter-model-chat", version.ref = "koog-spring-ai" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }
spring-ai-starter-model-openai = { module = "org.springframework.ai:spring-ai-starter-model-openai" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
