<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Koog Chat</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 3rem auto;
      padding: 0 1rem;
      color: #1a1a1a;
    }
    h1 { font-size: 1.4rem; }
    #response {
      white-space: pre-wrap;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1rem;
      min-height: 3rem;
      margin-top: 1rem;
      background: #fafafa;
    }
    form { display: flex; gap: 0.5rem; margin-top: 1rem; }
    input {
      flex: 1;
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      background: #1a1a1a;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .error { color: #b00020; }
    #lights { display: flex; gap: 1.5rem; margin: 1.5rem 0; }
    .light {
      display: grid;
      justify-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
    }
    .light-bulb {
      width: 2.5rem;
      height: 2.5rem;
      box-sizing: border-box;
      border: 1px solid #bbb;
      border-radius: 50%;
      background: var(--light-color);
      opacity: var(--light-opacity);
      box-shadow: 0 0 var(--light-glow) var(--light-color);
      transition: background 0.2s, box-shadow 0.2s, opacity 0.2s;
    }
  </style>
</head>
<body>
  <h1>Koog Chat</h1>
  <form id="chat-form">
    <input id="message" type="text" placeholder="Type a message..." autocomplete="off" required>
    <button id="send" type="submit">Send</button>
  </form>
  <div id="response"></div>
  <div id="lights" aria-label="Lights"></div>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message');
    const button = document.getElementById('send');
    const responseEl = document.getElementById('response');
    const lightsEl = document.getElementById('lights');

    async function updateLights() {
      try {
        const res = await fetch('/api/lights');
        if (!res.ok) return;

        const lights = await res.json();
        lightsEl.replaceChildren(...lights.map(light => {
          const item = document.createElement('div');
          item.className = 'light';

          const bulb = document.createElement('div');
          bulb.className = 'light-bulb';
          const { red, green, blue } = light.color;
          bulb.style.setProperty('--light-color', `rgb(${red}, ${green}, ${blue})`);
          bulb.style.setProperty('--light-opacity', light.on ? 0.25 + light.brightness * 0.0075 : 0.12);
          bulb.style.setProperty('--light-glow', light.on ? `${light.brightness / 8}px` : '0');
          bulb.title = `${light.on ? 'On' : 'Off'}, ${light.brightness}%`;
          bulb.setAttribute('role', 'img');
          bulb.setAttribute('aria-label', `${light.name}: ${bulb.title}`);

          const label = document.createElement('span');
          label.textContent = light.name;
          item.append(bulb, label);
          return item;
        }));
      } catch (_) {
        // Keep the last known state if polling temporarily fails.
      }
    }

    updateLights();
    setInterval(updateLights, 1000);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      button.disabled = true;
      responseEl.classList.remove('error');
      responseEl.textContent = 'Thinking...';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.response || 'Request failed');
        responseEl.textContent = data.response;
      } catch (err) {
        responseEl.classList.add('error');
        responseEl.textContent = 'Error: ' + err.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
